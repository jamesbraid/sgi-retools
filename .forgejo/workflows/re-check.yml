# Self-check for this repository: the decode-header and hardware-definition
# test suites and the ci-check entry point. Nothing here fetches submodules.
name: re-check
on:
  push:
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:22-bookworm-slim
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-pyelftools python3-capstone gcc libc6-dev rustc
      - name: Check out the repository
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Run the decode-header tests
        run: python3 tools/defs/test_defs.py
      - name: Run the hardware-definition tests
        run: python3 -m unittest discover -s tools/defs -p 'test_defslib_*.py'
      - name: Run the census header naming tests
        run: python3 tools/chips/test_gen_headers.py
      - name: Run the host-interface microcode reader tests
        run: python3 tools/gr4/test_hq_ucode_disasm.py
      - name: Run the inventory tests
        run: python3 tools/test_inventory.py
      - name: Run the environment variable scanner tests
        run: python3 tools/test_envscan.py
      - name: Run the reading grader tests
        run: python3 tools/test_grade_readings.py
      - name: Run the decode-header check
        run: tools/defs/ci-check
